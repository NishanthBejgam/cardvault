<!doctype html>
<!-- Source for assets/og-cover.jpg (1200x630 WhatsApp / X share card).
     Regenerate: python tools/make-og.py -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#0c0a18;font-family:"Plus Jakarta Sans",sans-serif;color:#f3f1ff;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(700px 520px at 8% 0%,rgba(124,58,237,.45),transparent 60%),radial-gradient(620px 520px at 100% 100%,rgba(99,102,241,.35),transparent 60%)}
.ring{position:absolute;left:-160px;bottom:-260px;width:560px;height:560px;border-radius:50%;border:70px solid rgba(255,255,255,.035)}
.left{position:absolute;left:72px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:20px}
.brand img{width:96px;height:96px;border-radius:26px;box-shadow:0 18px 40px -12px rgba(124,58,237,.9)}
.brand b{font-size:68px;font-weight:800;letter-spacing:-.04em;line-height:1}
.tag{margin-top:26px;font-size:34px;font-weight:700;line-height:1.2;letter-spacing:-.02em;color:#e6e0ff}
.tag em{font-style:normal;background:linear-gradient(135deg,#a5b4fc,#c4b5fd 50%,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.chip{padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);font-size:20px;font-weight:700;white-space:nowrap}
.chip b{color:#ffb27f}
.url{position:absolute;left:72px;bottom:40px;font-size:22px;font-weight:700;color:#a9a3cf}
.phones{position:absolute;right:40px;top:0;bottom:0;width:520px}
.ph{position:absolute;width:232px;aspect-ratio:9/16;border-radius:34px;padding:8px;background:#000;box-shadow:0 0 0 2px #2c2850,0 40px 80px -30px rgba(0,0,0,.9)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:27px}
.p1{left:30px;top:118px;transform:rotate(-7deg)}
.p2{left:250px;top:62px;transform:rotate(5deg);z-index:2}
</style></head>
<body>
<div class="glow"></div><div class="ring"></div>
<div class="left">
  <div class="brand"><img src="../assets/favicon.svg"><b>Card Vault</b></div>
  <p class="tag">Every family card,<br><em>locked on your phone.</em></p>
  <div class="chips">
    <span class="chip"><b>300+</b> CreditCard users</span>
    <span class="chip">Android &amp; iPhone</span>
    <span class="chip"><b>0</b> internet</span>
  </div>
</div>
<div class="url">cardvault.yourcardjourney.store</div>
<div class="phones">
  <div class="ph p1"><img src="../assets/09-relations-map.webp"></div>
  <div class="ph p2"><img src="../assets/01-cards.webp"></div>
</div>
</body></html>
